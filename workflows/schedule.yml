name: Scheduled Site Rebuild

on:
  schedule:
    # This runs the job every single day at 6:00 AM UTC (1:00 AM Central Time)
    - cron: '0 6 * * *'
  # This lets you manually trigger a rebuild if you ever want to force it
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages Deploy
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.create_dispatch_event({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'rebuild'
            })
